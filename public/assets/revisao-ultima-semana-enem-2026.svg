<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Revisão de última semana para o ENEM 2026</title>
  <desc id="desc">Plano visual de sete dias com questões, redação, revisão e logística</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#073b4c"/><stop offset="1" stop-color="#11866f"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".2"/></filter></defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/><circle cx="1490" cy="90" r="240" fill="#ffd166" opacity=".16"/><circle cx="90" cy="850" r="230" fill="#ef476f" opacity=".13"/>
  <g font-family="Arial,Helvetica,sans-serif"><text x="85" y="105" fill="#ffd166" font-size="34" font-weight="900" letter-spacing="3">MAPAS DO ENEM • RETA FINAL</text><text x="85" y="215" fill="#fff" font-size="78" font-weight="900">ÚLTIMA SEMANA</text><text x="85" y="285" fill="#d9fff6" font-size="40" font-weight="700">PLANO REALISTA DE 7 DIAS</text></g>
  <g transform="translate(80 350)" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" filter="url(#s)">
    <g><rect width="190" height="190" rx="26" fill="#ffd166"/><text x="95" y="65" font-size="29" font-weight="900" fill="#073b4c">DIA 7</text><text x="95" y="118" font-size="24" font-weight="700" fill="#073b4c">DIAGNÓSTICO</text><text x="95" y="155" font-size="21" fill="#073b4c">5 prioridades</text></g>
    <g transform="translate(215)"><rect width="190" height="190" rx="26" fill="#fff"/><text x="95" y="65" font-size="29" font-weight="900" fill="#073b4c">DIA 6</text><text x="95" y="118" font-size="24" font-weight="700" fill="#073b4c">LINGUAGENS</text><text x="95" y="155" font-size="21" fill="#073b4c">+ Humanas</text></g>
    <g transform="translate(430)"><rect width="190" height="190" rx="26" fill="#ef476f"/><text x="95" y="65" font-size="29" font-weight="900" fill="#fff">DIA 5</text><text x="95" y="118" font-size="24" font-weight="700" fill="#fff">REDAÇÃO</text><text x="95" y="155" font-size="21" fill="#fff">projeto de texto</text></g>
    <g transform="translate(645)"><rect width="190" height="190" rx="26" fill="#fff"/><text x="95" y="65" font-size="29" font-weight="900" fill="#073b4c">DIA 4</text><text x="95" y="118" font-size="24" font-weight="700" fill="#073b4c">NATUREZA</text><text x="95" y="155" font-size="21" fill="#073b4c">fundamentos</text></g>
    <g transform="translate(860)"><rect width="190" height="190" rx="26" fill="#06d6a0"/><text x="95" y="65" font-size="29" font-weight="900" fill="#073b4c">DIA 3</text><text x="95" y="118" font-size="24" font-weight="700" fill="#073b4c">MATEMÁTICA</text><text x="95" y="155" font-size="21" fill="#073b4c">procedimentos</text></g>
    <g transform="translate(1075)"><rect width="190" height="190" rx="26" fill="#fff"/><text x="95" y="65" font-size="29" font-weight="900" fill="#073b4c">DIA 2</text><text x="95" y="118" font-size="24" font-weight="700" fill="#073b4c">QUESTÕES</text><text x="95" y="155" font-size="21" fill="#073b4c">+ logística</text></g>
    <g transform="translate(1290)"><rect width="190" height="190" rx="26" fill="#ffd166"/><text x="95" y="65" font-size="29" font-weight="900" fill="#073b4c">DIA 1</text><text x="95" y="118" font-size="24" font-weight="700" fill="#073b4c">LEVE</text><text x="95" y="155" font-size="21" fill="#073b4c">organizar</text></g>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="800" y="665" fill="#fff" font-size="43" font-weight="900">RECORDAR → TESTAR → CORRIGIR</text><rect x="335" y="720" width="930" height="95" rx="47" fill="#062f3b" stroke="#ffd166" stroke-width="4"/><text x="800" y="780" fill="#ffd166" font-size="32" font-weight="800">MENOS CONTEÚDO • MAIS DECISÃO</text></g>
</svg>
