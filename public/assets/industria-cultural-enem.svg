<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Indústria cultural no ENEM</title><desc id="d">Mapa visual ligando produção, padronização, circulação, consumo e crítica.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43145f"/><stop offset="1" stop-color="#b1307b"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".24"/></filter></defs><rect width="1600" height="900" rx="36" fill="url(#g)"/><circle cx="1445" cy="100" r="230" fill="#ffc83d" opacity=".18"/><circle cx="80" cy="850" r="250" fill="#52e0c4" opacity=".15"/><g font-family="Arial,Helvetica,sans-serif"><text x="105" y="110" fill="#58e7cb" font-size="32" font-weight="700">MAPAS MENTAIS ENEM • SOCIOLOGIA</text><text x="105" y="218" fill="#fff" font-size="90" font-weight="900">INDÚSTRIA CULTURAL</text><text x="105" y="300" fill="#ffc83d" font-size="64" font-weight="900">CONCEITO + LEITURA CRÍTICA</text><text x="105" y="365" fill="#fff" font-size="30">Adorno, Horkheimer, mídia, consumo e sociedade.</text><g filter="url(#s)" text-anchor="middle"><rect x="105" y="475" width="245" height="145" rx="26" fill="#fff"/><text x="227" y="540" fill="#43145f" font-size="25" font-weight="800">PRODUÇÃO</text><text x="227" y="580" fill="#8d286f" font-size="20">planejamento</text><rect x="390" y="475" width="245" height="145" rx="26" fill="#58e7cb"/><text x="512" y="540" fill="#43145f" font-size="25" font-weight="800">PADRÃO</text><text x="512" y="580" fill="#43145f" font-size="20">fórmulas</text><rect x="675" y="475" width="245" height="145" rx="26" fill="#ffc83d"/><text x="797" y="540" fill="#43145f" font-size="25" font-weight="800">CIRCULAÇÃO</text><text x="797" y="580" fill="#43145f" font-size="20">mídia</text><rect x="960" y="475" width="245" height="145" rx="26" fill="#fff"/><text x="1082" y="540" fill="#43145f" font-size="25" font-weight="800">CONSUMO</text><text x="1082" y="580" fill="#8d286f" font-size="20">preferências</text><rect x="1245" y="475" width="245" height="145" rx="26" fill="#58e7cb"/><text x="1367" y="540" fill="#43145f" font-size="25" font-weight="800">CRÍTICA</text><text x="1367" y="580" fill="#43145f" font-size="20">autonomia?</text></g><g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"><path d="M358 548h24M643 548h24M928 548h24M1213 548h24"/></g><rect x="105" y="710" width="1385" height="90" rx="24" fill="#321044"/><text x="797" y="765" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">Não é “tudo igual”: investigue quem produz, circula e lucra.</text></g></svg>