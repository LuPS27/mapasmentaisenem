<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Demografia no ENEM</title><desc id="desc">Mapa visual conectando nascimentos, mortes e migrações à estrutura etária e às políticas públicas</desc>
  <rect width="1600" height="900" fill="#eefbf6"/><circle cx="1460" cy="95" r="245" fill="#2d6cdf" opacity=".14"/><circle cx="105" cy="825" r="245" fill="#ffd166" opacity=".28"/>
  <text x="100" y="110" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f766e">MAPAS DO ENEM • GEOGRAFIA</text>
  <text x="100" y="235" font-family="Arial,sans-serif" font-size="86" font-weight="900" fill="#20243a">DEMOGRAFIA</text><text x="100" y="320" font-family="Arial,sans-serif" font-size="46" font-weight="900" fill="#e05263">COMO A POPULAÇÃO MUDA?</text>
  <rect x="90" y="410" width="370" height="240" rx="38" fill="#ffd166" stroke="#20243a" stroke-width="7"/><text x="275" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="900" fill="#20243a">NASCIMENTOS</text><text x="275" y="550" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="900" fill="#20243a">− MORTES</text><text x="275" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="#20243a">CRESCIMENTO NATURAL</text>
  <path d="M475 530 L570 530" stroke="#20243a" stroke-width="12" stroke-linecap="round"/><path d="M545 505 L575 530 L545 555" fill="none" stroke="#20243a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="600" y="410" width="370" height="240" rx="38" fill="#e05263" stroke="#20243a" stroke-width="7"/><text x="785" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="900" fill="#fff">IMIGRAÇÃO</text><text x="785" y="550" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="900" fill="#fff">− EMIGRAÇÃO</text><text x="785" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="#fff">SALDO MIGRATÓRIO</text>
  <path d="M985 530 L1080 530" stroke="#20243a" stroke-width="12" stroke-linecap="round"/><path d="M1055 505 L1085 530 L1055 555" fill="none" stroke="#20243a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1110" y="410" width="400" height="240" rx="38" fill="#31c4a4" stroke="#20243a" stroke-width="7"/><text x="1310" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="900" fill="#20243a">ESTRUTURA</text><text x="1310" y="540" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="900" fill="#20243a">ETÁRIA</text><text x="1310" y="600" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="#20243a">SERVIÇOS E POLÍTICAS</text>
  <rect x="275" y="740" width="1050" height="95" rx="48" fill="#2d6cdf" stroke="#20243a" stroke-width="7"/><text x="800" y="802" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="#fff">PIRÂMIDES • TRANSIÇÃO • ENVELHECIMENTO • MIGRAÇÕES</text>
