<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">PA e PG no ENEM</title><desc id="desc">Comparação visual entre progressão aritmética e progressão geométrica, com termo geral e soma.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#072f45"/><stop offset="1" stop-color="#116b6d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".25"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1450" cy="80" r="220" fill="#ffd34f" opacity=".18"/><circle cx="110" cy="820" r="250" fill="#65e2ff" opacity=".13"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="100" y="105" fill="#7ee9ff" font-size="34" font-weight="700">MATEMÁTICA • SEQUÊNCIAS</text><text x="100" y="205" fill="#fff" font-size="88" font-weight="900">PA E PG NO ENEM</text><text x="100" y="265" fill="#d9f7fa" font-size="34">Primeiro identifique o padrão. Depois escolha a fórmula.</text>
<g filter="url(#s)"><rect x="100" y="350" width="650" height="270" rx="32" fill="#fff"/><text x="145" y="420" fill="#073b52" font-size="42" font-weight="900">PA • SOMAR</text><text x="145" y="480" fill="#284e5d" font-size="30">2, 5, 8, 11...  razão r = 3</text><text x="145" y="535" fill="#284e5d" font-size="29">aₙ = a₁ + (n − 1)r</text><text x="145" y="580" fill="#284e5d" font-size="27">crescimento linear</text>
<rect x="850" y="350" width="650" height="270" rx="32" fill="#ffd34f"/><text x="895" y="420" fill="#073b52" font-size="42" font-weight="900">PG • MULTIPLICAR</text><text x="895" y="480" fill="#284e5d" font-size="30">2, 6, 18, 54...  razão q = 3</text><text x="895" y="535" fill="#284e5d" font-size="29">aₙ = a₁ · qⁿ⁻¹</text><text x="895" y="580" fill="#284e5d" font-size="27">crescimento exponencial</text></g>
<rect x="100" y="690" width="1400" height="95" rx="28" fill="#06384d" stroke="#fff" stroke-opacity=".25" stroke-width="3"/><text x="145" y="750" fill="#fff" font-size="31" font-weight="800">PERGUNTA-CHAVE:</text><text x="475" y="750" fill="#fff" font-size="30">quer um termo específico ou o total acumulado?</text>
<text x="100" y="848" fill="#fff" font-size="29" font-weight="700">MAPAS MENTAIS ENEM</text></g></svg>