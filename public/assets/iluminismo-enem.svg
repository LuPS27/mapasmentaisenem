<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Iluminismo no ENEM</title><desc id="desc">Mapa visual ligando razão, direitos, separação dos poderes e soberania popular.</desc>
<rect width="1600" height="900" fill="#eef8ff"/><rect width="1600" height="150" fill="#163b67"/><circle cx="1450" cy="120" r="210" fill="#ffc83d"/><circle cx="118" cy="810" r="175" fill="#f06473"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#132d4c"><text x="90" y="98" font-size="38" font-weight="700" fill="#fff">MAPAS DO ENEM • CIÊNCIAS HUMANAS</text>
<text x="90" y="260" font-size="78" font-weight="900">ILUMINISMO</text><text x="90" y="325" font-size="36" font-weight="700">PODER SOB A LUZ DA CRÍTICA</text>
<g transform="translate(90 390)"><rect width="330" height="245" rx="32" fill="#ffd44f"/><text x="165" y="70" text-anchor="middle" font-size="32" font-weight="900">RAZÃO</text><text x="165" y="125" text-anchor="middle" font-size="25">Questionar tradições</text><text x="165" y="165" text-anchor="middle" font-size="25">e justificar escolhas</text><path d="M275 190l34 20-34 20z" fill="#163b67"/></g>
<g transform="translate(455 390)"><rect width="330" height="245" rx="32" fill="#6bd5df"/><text x="165" y="70" text-anchor="middle" font-size="32" font-weight="900">DIREITOS</text><text x="165" y="125" text-anchor="middle" font-size="25">Vida, liberdade</text><text x="165" y="165" text-anchor="middle" font-size="25">e governo limitado</text><path d="M275 190l34 20-34 20z" fill="#163b67"/></g>
<g transform="translate(820 390)"><rect width="330" height="245" rx="32" fill="#b7ea7d"/><text x="165" y="70" text-anchor="middle" font-size="30" font-weight="900">PODERES</text><text x="165" y="125" text-anchor="middle" font-size="25">Equilíbrio, controle</text><text x="165" y="165" text-anchor="middle" font-size="25">e moderação</text><path d="M275 190l34 20-34 20z" fill="#163b67"/></g>
<g transform="translate(1185 390)"><rect width="330" height="245" rx="32" fill="#ff9a70"/><text x="165" y="70" text-anchor="middle" font-size="29" font-weight="900">SOBERANIA</text><text x="165" y="125" text-anchor="middle" font-size="25">Povo, vontade geral</text><text x="165" y="165" text-anchor="middle" font-size="25">e bem comum</text><path d="M275 190l34 20-34 20z" fill="#163b67"/></g>
<rect x="290" y="710" width="1020" height="110" rx="55" fill="#163b67"/><text x="800" y="780" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">AUTOR → PROBLEMA → CONCEITO → CONTEXTO → LIMITE</text></g></svg>