<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Juros no ENEM</title><desc id="desc">Mapa visual de capital, taxa, tempo, juros simples, juros compostos e montante</desc>
  <rect width="1600" height="900" fill="#f0fdf4"/><circle cx="1480" cy="80" r="260" fill="#49a8e8" opacity=".18"/><circle cx="105" cy="835" r="260" fill="#ffd166" opacity=".32"/>
  <text x="100" y="105" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f766e">MAPAS DO ENEM • MATEMÁTICA</text>
  <text x="100" y="225" font-family="Arial,sans-serif" font-size="82" font-weight="900" fill="#20243a">JUROS NO ENEM</text>
  <text x="100" y="305" font-family="Arial,sans-serif" font-size="45" font-weight="900" fill="#e05263">QUAL É A BASE DA TAXA?</text>
  <rect x="95" y="395" width="410" height="265" rx="38" fill="#ffd166" stroke="#20243a" stroke-width="7"/>
  <text x="300" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="900" fill="#20243a">JUROS SIMPLES</text>
  <text x="300" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#20243a">MESMA BASE</text>
  <text x="300" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="900" fill="#20243a">J = C × i × t</text>
  <path d="M545 525h120" stroke="#20243a" stroke-width="16" stroke-linecap="round"/><path d="m645 495 40 30-40 30" fill="none" stroke="#20243a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="705" y="395" width="430" height="265" rx="38" fill="#31c4a4" stroke="#20243a" stroke-width="7"/>
  <text x="920" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="900" fill="#20243a">JUROS COMPOSTOS</text>
  <text x="920" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#20243a">SALDO ATUALIZADO</text>
  <text x="920" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="900" fill="#20243a">M = C × (1 + i)ᵗ</text>
  <path d="M1175 525h95" stroke="#20243a" stroke-width="16" stroke-linecap="round"/><path d="m1250 495 40 30-40 30" fill="none" stroke="#20243a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1310" y="395" width="205" height="265" rx="38" fill="#7c5cff" stroke="#20243a" stroke-width="7"/>
  <text x="1412" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="900" fill="#fff">MONTANTE</text>
  <text x="1412" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="900" fill="#fff">M</text>
  <text x="1412" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#fff">C + J</text>
  <rect x="245" y="745" width="1110" height="100" rx="50" fill="#20243a"/>
  <text x="800" y="810" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="900" fill="#fff">CITAM: CAPITAL • ÍNDICE • TEMPO • ACUMULAÇÃO • MONTANTE</text>
</svg>
