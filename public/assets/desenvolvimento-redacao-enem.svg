<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Desenvolvimento da redação do ENEM</title>
  <desc id="desc">Mapa visual com a sequência tese, explicação, evidência e análise</desc>
  <rect width="1600" height="900" fill="#fff7df"/>
  <circle cx="1450" cy="120" r="180" fill="#ff5f57" opacity=".18"/>
  <circle cx="130" cy="790" r="220" fill="#33c3a5" opacity=".18"/>
  <text x="110" y="135" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f766e">MAPAS DO ENEM • REDAÇÃO</text>
  <text x="110" y="235" font-family="Arial,sans-serif" font-size="76" font-weight="900" fill="#20243a">DESENVOLVIMENTO</text>
  <text x="110" y="310" font-family="Arial,sans-serif" font-size="50" font-weight="800" fill="#ff5f57">argumento que avança</text>
  <g font-family="Arial,sans-serif" font-weight="800" text-anchor="middle">
    <rect x="105" y="420" width="300" height="155" rx="32" fill="#ffd166" stroke="#20243a" stroke-width="6"/>
    <text x="255" y="485" font-size="31" fill="#20243a">1. AFIRME</text><text x="255" y="530" font-size="24" fill="#20243a">ideia do parágrafo</text>
    <path d="M420 498h70" stroke="#20243a" stroke-width="14"/><path d="m475 475 28 23-28 23" fill="none" stroke="#20243a" stroke-width="14"/>
    <rect x="505" y="420" width="300" height="155" rx="32" fill="#33c3a5" stroke="#20243a" stroke-width="6"/>
    <text x="655" y="485" font-size="31" fill="#20243a">2. EXPLIQUE</text><text x="655" y="530" font-size="24" fill="#20243a">como e por quê</text>
    <path d="M820 498h70" stroke="#20243a" stroke-width="14"/><path d="m875 475 28 23-28 23" fill="none" stroke="#20243a" stroke-width="14"/>
    <rect x="905" y="420" width="300" height="155" rx="32" fill="#65a7ff" stroke="#20243a" stroke-width="6"/>
    <text x="1055" y="485" font-size="31" fill="#20243a">3. COMPROVE</text><text x="1055" y="530" font-size="24" fill="#20243a">exemplo ou dado</text>
    <path d="M1220 498h70" stroke="#20243a" stroke-width="14"/><path d="m1275 475 28 23-28 23" fill="none" stroke="#20243a" stroke-width="14"/>
    <rect x="1305" y="420" width="190" height="155" rx="32" fill="#ff7b88" stroke="#20243a" stroke-width="6"/>
    <text x="1400" y="485" font-size="28" fill="#20243a">4. ANALISE</text><text x="1400" y="530" font-size="21" fill="#20243a">ligue à tese</text>
  </g>
  <rect x="320" y="690" width="960" height="100" rx="50" fill="#20243a"/>
  <text x="800" y="753" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">CONEXÃO IMPORTA MAIS QUE FRASE PRONTA</text>
