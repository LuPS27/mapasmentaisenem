<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Introdução da redação do ENEM</title>
  <desc id="desc">Mapa visual conectando tema, recorte, tese e argumentos.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#7f1d1d"/><stop offset="1" stop-color="#c2410c"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".25"/></filter></defs>
  <rect width="1600" height="900" rx="46" fill="url(#bg)"/>
  <circle cx="1390" cy="130" r="230" fill="#fde047" opacity=".18"/><circle cx="150" cy="820" r="270" fill="#fdba74" opacity=".14"/>
  <text x="100" y="120" fill="#fef3c7" font-family="Arial,sans-serif" font-size="36" font-weight="700">REDAÇÃO • MAPA DE REVISÃO</text>
  <text x="100" y="230" fill="white" font-family="Arial,sans-serif" font-size="82" font-weight="900">INTRODUÇÃO</text>
  <text x="100" y="305" fill="#ffedd5" font-family="Arial,sans-serif" font-size="42">clareza • posição • planejamento</text>
  <g filter="url(#sh)" font-family="Arial,sans-serif"><rect x="80" y="430" width="320" height="150" rx="30" fill="white"/><text x="175" y="520" fill="#b91c1c" font-size="36" font-weight="900">TEMA</text><rect x="465" y="430" width="300" height="150" rx="30" fill="white"/><text x="525" y="520" fill="#c2410c" font-size="36" font-weight="900">RECORTE</text><rect x="830" y="430" width="300" height="150" rx="30" fill="white"/><text x="915" y="520" fill="#9f1239" font-size="36" font-weight="900">TESE</text><rect x="1195" y="430" width="325" height="150" rx="30" fill="white"/><text x="1215" y="520" fill="#b45309" font-size="29" font-weight="900">ARGUMENTOS</text></g>
  <path d="M410 505 H450 M775 505 H815 M1140 505 H1180" stroke="#fde047" stroke-width="13" stroke-linecap="round"/><path d="M440 485 L460 505 L440 525 M805 485 L825 505 L805 525 M1170 485 L1190 505 L1170 525" fill="none" stroke="#fde047" stroke-width="9"/>
  <g filter="url(#sh)"><rect x="245" y="680" width="1110" height="112" rx="32" fill="#fff7ed"/><text x="345" y="753" fill="#7c2d12" font-family="Arial,sans-serif" font-size="39" font-weight="900">CONTEXTO → PONTE → PONTO DE VISTA</text></g>
  <text x="100" y="850" fill="white" font-family="Arial,sans-serif" font-size="29" font-weight="700">Mapas do ENEM • apresente o caminho do texto</text>
</svg>
