<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Análise combinatória no ENEM</title><desc id="desc">Mapa visual com etapas, ordem, repetição e restrições para contar possibilidades.</desc>
<rect width="1600" height="900" fill="#f2f5ff"/><rect width="1600" height="150" fill="#392f91"/><circle cx="1460" cy="115" r="210" fill="#ffca3a"/><circle cx="100" cy="825" r="170" fill="#27c2a2"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#24205b"><text x="90" y="98" font-size="38" font-weight="700" fill="#fff">MAPAS DO ENEM • MATEMÁTICA</text>
<text x="90" y="255" font-size="67" font-weight="900">ANÁLISE COMBINATÓRIA</text><text x="90" y="322" font-size="36" font-weight="700">CONTE SEM DECORAR FÓRMULAS</text>
<g transform="translate(90 390)"><rect width="330" height="245" rx="32" fill="#ffd34e"/><text x="165" y="68" text-anchor="middle" font-size="32" font-weight="900">ETAPAS</text><text x="165" y="125" text-anchor="middle" font-size="25">Uma escolha</text><text x="165" y="165" text-anchor="middle" font-size="25">depois da outra?</text><path d="M274 190l35 21-35 21z" fill="#392f91"/></g>
<g transform="translate(455 390)"><rect width="330" height="245" rx="32" fill="#6bd9ea"/><text x="165" y="68" text-anchor="middle" font-size="32" font-weight="900">ORDEM</text><text x="165" y="125" text-anchor="middle" font-size="25">Trocar posições</text><text x="165" y="165" text-anchor="middle" font-size="25">muda o resultado?</text><path d="M274 190l35 21-35 21z" fill="#392f91"/></g>
<g transform="translate(820 390)"><rect width="330" height="245" rx="32" fill="#ff8a70"/><text x="165" y="68" text-anchor="middle" font-size="30" font-weight="900">REPETIÇÃO</text><text x="165" y="125" text-anchor="middle" font-size="25">Pode escolher</text><text x="165" y="165" text-anchor="middle" font-size="25">o mesmo de novo?</text><path d="M274 190l35 21-35 21z" fill="#392f91"/></g>
<g transform="translate(1185 390)"><rect width="330" height="245" rx="32" fill="#b8ea7c"/><text x="165" y="68" text-anchor="middle" font-size="29" font-weight="900">RESTRIÇÕES</text><text x="165" y="125" text-anchor="middle" font-size="25">Exatamente?</text><text x="165" y="165" text-anchor="middle" font-size="25">Pelo menos? Distintos?</text><path d="M274 190l35 21-35 21z" fill="#392f91"/></g>
<rect x="320" y="710" width="960" height="112" rx="56" fill="#392f91"/><text x="800" y="780" text-anchor="middle" font-size="36" font-weight="800" fill="#fff">EOR: ETAPAS → ORDEM → RESTRIÇÕES</text></g></svg>