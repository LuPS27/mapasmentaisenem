<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Impulso e quantidade de movimento no ENEM</title><desc id="d">Mapa visual com as relações p igual a massa vezes velocidade, impulso igual a força vezes tempo e conservação nas colisões.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071d4d"/><stop offset="1" stop-color="#0b74a8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".25"/></filter></defs><rect width="1600" height="900" rx="36" fill="url(#g)"/><circle cx="1450" cy="120" r="240" fill="#ffcc45" opacity=".16"/><circle cx="80" cy="850" r="260" fill="#42e2c4" opacity=".15"/><g font-family="Arial,Helvetica,sans-serif"><text x="105" y="105" fill="#49e2c4" font-size="32" font-weight="700">MAPAS MENTAIS ENEM • FÍSICA</text><text x="105" y="205" fill="#fff" font-size="78" font-weight="900">IMPULSO E QUANTIDADE</text><text x="105" y="285" fill="#ffcc45" font-size="72" font-weight="900">DE MOVIMENTO</text><text x="105" y="350" fill="#fff" font-size="29">Estado, mudança e conservação em um só mapa.</text><g filter="url(#s)" text-anchor="middle"><rect x="105" y="455" width="390" height="180" rx="28" fill="#fff"/><text x="300" y="520" fill="#071d4d" font-size="28" font-weight="800">QUANTIDADE</text><text x="300" y="585" fill="#0b74a8" font-size="48" font-weight="900">p = m · v</text><rect x="605" y="455" width="390" height="180" rx="28" fill="#49e2c4"/><text x="800" y="520" fill="#071d4d" font-size="28" font-weight="800">IMPULSO</text><text x="800" y="585" fill="#071d4d" font-size="43" font-weight="900">I = F · Δt = Δp</text><rect x="1105" y="455" width="390" height="180" rx="28" fill="#ffcc45"/><text x="1300" y="520" fill="#071d4d" font-size="28" font-weight="800">CONSERVAÇÃO</text><text x="1300" y="580" fill="#071d4d" font-size="34" font-weight="900">p antes = p depois</text></g><path d="M520 545h60m-22-22 22 22-22 22M1020 545h60m-22-22 22 22-22 22" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><rect x="105" y="710" width="1390" height="88" rx="24" fill="#041538"/><text x="800" y="765" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">Sempre defina o sistema e escolha o sentido positivo.</text></g></svg>