<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ditadura militar no ENEM</title>
  <desc id="desc">Linha do tempo visual do golpe de 1964 à redemocratização</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8e7"/><stop offset="1" stop-color="#e9f1ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".15"/></filter>
  </defs>
  <rect width="1600" height="900" rx="46" fill="url(#bg)"/>
  <circle cx="1460" cy="90" r="210" fill="#f3c54b" opacity=".27"/>
  <circle cx="90" cy="820" r="220" fill="#377d71" opacity=".17"/>
  <text x="76" y="82" fill="#18324d" font-family="Arial,sans-serif" font-size="28" font-weight="800">MAPAS MENTAIS ENEM • HISTÓRIA</text>
  <g filter="url(#shadow)">
    <rect x="170" y="140" width="1260" height="250" rx="42" fill="#18324d"/>
    <text x="800" y="245" text-anchor="middle" fill="#f3c54b" font-family="Arial,sans-serif" font-size="54" font-weight="900">DITADURA MILITAR NO ENEM</text>
    <text x="800" y="320" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="31">poder • economia • resistência • democracia</text>
  </g>
  <line x1="235" y1="590" x2="1365" y2="590" stroke="#18324d" stroke-width="12" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <circle cx="280" cy="590" r="58" fill="#d9524b"/><text x="280" y="604" fill="white" font-size="27" font-weight="800">1964</text>
    <rect x="160" y="685" width="240" height="95" rx="24" fill="#d9524b"/><text x="280" y="745" fill="white" font-size="30" font-weight="800">GOLPE</text>
    <circle cx="630" cy="590" r="58" fill="#dc7c32"/><text x="630" y="604" fill="white" font-size="27" font-weight="800">1968</text>
    <rect x="510" y="425" width="240" height="95" rx="24" fill="#dc7c32"/><text x="630" y="485" fill="white" font-size="30" font-weight="800">AI-5</text>
    <circle cx="980" cy="590" r="58" fill="#377d71"/><text x="980" y="604" fill="white" font-size="27" font-weight="800">1979</text>
    <rect x="840" y="685" width="280" height="95" rx="24" fill="#377d71"/><text x="980" y="745" fill="white" font-size="29" font-weight="800">ABERTURA</text>
    <circle cx="1320" cy="590" r="58" fill="#4776e6"/><text x="1320" y="604" fill="white" font-size="27" font-weight="800">1985</text>
    <rect x="1170" y="425" width="300" height="95" rx="24" fill="#4776e6"/><text x="1320" y="485" fill="white" font-size="27" font-weight="800">REDEMOCRATIZAÇÃO</text>
  </g>
  <g fill="#18324d" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">
    <text x="455" y="570">REPRESSÃO</text><text x="805" y="635">RESISTÊNCIA</text><text x="1150" y="570">DIRETAS JÁ</text>
  </g>
  <text x="800" y="850" text-anchor="middle" fill="#18324d" font-family="Arial,sans-serif" font-size="26" font-weight="700">Leia fontes. Relacione processos. Questione silêncios.</text>
</svg>
