<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Gabarito do ENEM 2026</title><desc id="desc">Guia visual para localizar o gabarito oficial por dia, número, cor e tipo de caderno.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132a57"/><stop offset="1" stop-color="#4267d9"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".25"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1460" cy="110" r="240" fill="#ffd34d"/><circle cx="80" cy="830" r="255" fill="#4de1c1" opacity=".9"/>
<text x="105" y="130" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#9ceeff">INFORMAÇÃO OFICIAL • 23/11/2026</text>
<text x="105" y="250" font-family="Arial,sans-serif" font-size="88" font-weight="900" fill="#fff">GABARITO DO</text>
<text x="105" y="340" font-family="Arial,sans-serif" font-size="88" font-weight="900" fill="#ffd34d">ENEM 2026</text>
<g filter="url(#s)" font-family="Arial,sans-serif">
<rect x="105" y="420" width="1390" height="260" rx="34" fill="#fff"/>
<circle cx="250" cy="550" r="78" fill="#4267d9"/><text x="250" y="568" text-anchor="middle" font-size="50" font-weight="900" fill="#fff">1</text>
<text x="365" y="510" font-size="30" font-weight="900" fill="#172a50">CONFIRA O DIA</text><text x="365" y="560" font-size="25" fill="#273b5f">8 ou 15 de novembro</text>
<circle cx="775" cy="550" r="78" fill="#f36b46"/><text x="775" y="568" text-anchor="middle" font-size="50" font-weight="900" fill="#fff">2</text>
<text x="890" y="510" font-size="30" font-weight="900" fill="#172a50">NÚMERO + COR</text><text x="890" y="560" font-size="25" fill="#273b5f">Ex.: Caderno 7 Azul</text>
<circle cx="1260" cy="550" r="78" fill="#14a98e"/><text x="1260" y="568" text-anchor="middle" font-size="50" font-weight="900" fill="#fff">3</text>
<text x="1360" y="510" font-size="27" font-weight="900" fill="#172a50" text-anchor="middle">MODALIDADE</text><text x="1360" y="560" font-size="23" fill="#273b5f" text-anchor="middle">Regular ou acessível</text>
</g>
<rect x="305" y="750" width="990" height="88" rx="38" fill="#ffd34d"/><text x="800" y="808" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="900" fill="#172a50">ACERTOS ≠ NOTA FINAL DA TRI</text>
</svg>