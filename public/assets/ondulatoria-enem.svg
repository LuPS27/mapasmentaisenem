<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ondulatória no ENEM</title>
  <desc id="desc">Mapa visual conectando frequência, comprimento de onda, som, luz e efeito Doppler.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101b4b"/><stop offset="1" stop-color="#5b21b6"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".22"/></filter></defs>
  <rect width="1600" height="900" rx="46" fill="url(#bg)"/>
  <circle cx="1380" cy="145" r="210" fill="#22d3ee" opacity=".15"/><circle cx="180" cy="820" r="260" fill="#f472b6" opacity=".12"/>
  <text x="100" y="120" fill="#67e8f9" font-family="Arial,sans-serif" font-size="36" font-weight="700">FÍSICA • MAPA DE REVISÃO</text>
  <text x="100" y="225" fill="white" font-family="Arial,sans-serif" font-size="86" font-weight="900">ONDULATÓRIA</text>
  <text x="100" y="292" fill="#e9d5ff" font-family="Arial,sans-serif" font-size="38">ondas, som, luz e efeito Doppler</text>
  <path d="M120 470 C220 350 320 590 420 470 S620 350 720 470 S920 590 1020 470 S1220 350 1320 470 S1460 550 1510 470" fill="none" stroke="#67e8f9" stroke-width="18" stroke-linecap="round"/>
  <line x1="220" y1="470" x2="220" y2="350" stroke="#facc15" stroke-width="7"/><path d="M205 370 L220 345 L235 370" fill="none" stroke="#facc15" stroke-width="7"/><text x="242" y="403" fill="#fef08a" font-family="Arial,sans-serif" font-size="28" font-weight="700">amplitude</text>
  <line x1="420" y1="620" x2="820" y2="620" stroke="#f472b6" stroke-width="7"/><path d="M445 605 L420 620 L445 635 M795 605 L820 620 L795 635" fill="none" stroke="#f472b6" stroke-width="7"/><text x="515" y="680" fill="#fbcfe8" font-family="Arial,sans-serif" font-size="30" font-weight="700">comprimento de onda λ</text>
  <g filter="url(#shadow)"><rect x="1020" y="590" width="460" height="190" rx="34" fill="white"/><text x="1080" y="675" fill="#312e81" font-family="Arial,sans-serif" font-size="54" font-weight="900">v = λ · f</text><text x="1080" y="735" fill="#5b21b6" font-family="Arial,sans-serif" font-size="27" font-weight="700">meio • frequência • propagação</text></g>
  <text x="100" y="835" fill="white" font-family="Arial,sans-serif" font-size="30" font-weight="700">Mapas do ENEM • entenda o que muda e o que permanece constante</text>
