<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Genética no ENEM</title>
  <desc id="desc">Mapa visual conectando alelos, heredograma, cruzamento, probabilidade e grupos sanguíneos.</desc>
  <rect width="1600" height="900" rx="48" fill="#f7efd9"/>
  <circle cx="1470" cy="105" r="220" fill="#69ce8a"/>
  <circle cx="115" cy="820" r="200" fill="#ff6d8e"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#111">
    <text x="82" y="100" font-size="34" font-weight="900" letter-spacing="4">BIOLOGIA • CIÊNCIAS DA NATUREZA</text>
    <text x="82" y="230" font-size="98" font-weight="900">GENÉTICA</text>
    <text x="86" y="310" font-size="42" font-weight="800">HEREDOGRAMAS + PROBABILIDADE</text>
  </g>
  <g transform="translate(80 380)" stroke="#111" stroke-width="9">
    <rect x="0" y="0" width="320" height="180" rx="28" fill="#ffd83e"/>
    <rect x="375" y="0" width="320" height="180" rx="28" fill="#75b7ff"/>
    <rect x="750" y="0" width="320" height="180" rx="28" fill="#cbbfff"/>
    <rect x="1125" y="0" width="320" height="180" rx="28" fill="#ff9e69"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#111" text-anchor="middle" font-weight="900">
    <text x="240" y="455" font-size="38">ALELOS</text><text x="240" y="510" font-size="32">A • a</text>
    <text x="615" y="455" font-size="35">HEREDOGRAMA</text><text x="615" y="510" font-size="31">○ □ ● ■</text>
    <text x="990" y="455" font-size="38">CRUZAMENTO</text><text x="990" y="510" font-size="31">Aa × Aa</text>
    <text x="1365" y="455" font-size="36">PROBABILIDADE</text><text x="1365" y="510" font-size="31">1/4 • 1/2</text>
  </g>
  <g stroke="#111" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M400 470h65"/><path d="M440 435l35 35-35 35"/>
    <path d="M775 470h65"/><path d="M815 435l35 35-35 35"/>
    <path d="M1150 470h65"/><path d="M1190 435l35 35-35 35"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#111" font-weight="900" text-anchor="middle">
    <text x="800" y="700" font-size="47">TRADUZA O ENUNCIADO ANTES DA CONTA</text>
    <text x="800" y="780" font-size="36">GENÓTIPO • FENÓTIPO • ABO • Rh</text>
  </g>
</svg>


