<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Texto verbal e não verbal no ENEM</title><desc id="desc">Mapa visual com palavras, imagens, cores, tipografia, contexto e efeito de sentido.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#261245"/><stop offset="1" stop-color="#742b75"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".25"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1430" cy="110" r="220" fill="#ffcf4b" opacity=".16"/><circle cx="100" cy="800" r="240" fill="#67e9de" opacity=".12"/><g font-family="Arial,Helvetica,sans-serif"><text x="100" y="105" fill="#67e9de" font-size="34" font-weight="700">LINGUAGENS • MULTIMODALIDADE</text><text x="100" y="198" fill="#fff" font-size="71" font-weight="900">VERBAL + NÃO VERBAL</text><text x="100" y="258" fill="#f3def4" font-size="34">O sentido nasce da relação entre os recursos</text><g filter="url(#s)"><rect x="100" y="350" width="410" height="225" rx="30" fill="#fff"/><text x="145" y="417" fill="#32134f" font-size="38" font-weight="900">VERBAL</text><text x="145" y="475" fill="#56415f" font-size="28">palavras • tom • slogan</text><text x="145" y="520" fill="#56415f" font-size="28">argumento • ambiguidade</text><rect x="595" y="350" width="410" height="225" rx="30" fill="#ffcf4b"/><text x="640" y="417" fill="#32134f" font-size="38" font-weight="900">VISUAL</text><text x="640" y="475" fill="#56415f" font-size="28">imagem • cor • posição</text><text x="640" y="520" fill="#56415f" font-size="28">tipografia • enquadramento</text><rect x="1090" y="350" width="410" height="225" rx="30" fill="#67e9de"/><text x="1135" y="417" fill="#32134f" font-size="38" font-weight="900">CONTEXTO</text><text x="1135" y="475" fill="#56415f" font-size="28">gênero • público • suporte</text><text x="1135" y="520" fill="#56415f" font-size="28">propósito • circulação</text></g><g stroke="#fff" stroke-width="9" fill="none"><path d="M510 462 H580"/><path d="M570 444 L595 462 570 480"/><path d="M1005 462 H1075"/><path d="M1065 444 L1090 462 1065 480"/></g><rect x="100" y="655" width="1400" height="125" rx="30" fill="#33174f" stroke="#fff" stroke-opacity=".25" stroke-width="3"/><text x="145" y="712" fill="#fff" font-size="31" font-weight="800">NA QUESTÃO:</text><text x="415" y="712" fill="#fff" font-size="30">descreva → relacione → explique o efeito</text><text x="145" y="758" fill="#d7fff9" font-size="27">A imagem confirma, amplia, substitui ou contradiz as palavras?</text><text x="100" y="846" fill="#fff" font-size="29" font-weight="700">MAPAS MENTAIS ENEM</text></g></svg>