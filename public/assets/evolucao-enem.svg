  <path d="M405 530 L490 530" stroke="#20243a" stroke-width="11"/><path d="M465 505 L495 530 L465 555" fill="none" stroke="#20243a" stroke-width="11"/>
  <rect x="520" y="420" width="300" height="220" rx="38" fill="#e05263" stroke="#20243a" stroke-width="7"/><text x="670" y="515" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="900" fill="#fff">AMBIENTE</text><text x="670" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#fff">PRESSÃO SELETIVA</text>
  <path d="M835 530 L920 530" stroke="#20243a" stroke-width="11"/><path d="M895 505 L925 530 L895 555" fill="none" stroke="#20243a" stroke-width="11"/>
