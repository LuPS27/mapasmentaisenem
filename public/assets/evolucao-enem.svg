<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Evolução no ENEM</title><desc id="desc">Mapa visual ligando variação, ambiente, reprodução e gerações à mudança das populações</desc>
  <rect width="1600" height="900" fill="#f2f8ff"/><circle cx="1460" cy="80" r="245" fill="#7c5cff" opacity=".14"/><circle cx="100" cy="825" r="250" fill="#ffd166" opacity=".28"/>
  <text x="100" y="110" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f766e">MAPAS DO ENEM • BIOLOGIA</text>
  <text x="100" y="235" font-family="Arial,sans-serif" font-size="88" font-weight="900" fill="#20243a">EVOLUÇÃO</text><text x="100" y="320" font-family="Arial,sans-serif" font-size="45" font-weight="900" fill="#e05263">POPULAÇÕES MUDAM ENTRE GERAÇÕES</text>
