  <rect x="260" y="740" width="1080" height="95" rx="48" fill="#7c5cff" stroke="#20243a" stroke-width="7"/><text x="800" y="802" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="#fff">SELEÇÃO • DERIVA • FLUXO GÊNICO • ESPECIAÇÃO</text>
