<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Leis de Newton no ENEM</title><desc id="desc">Mapa visual com inércia, força resultante, ação e reação e diagrama de forças.</desc>
  <rect width="1600" height="900" rx="48" fill="#cfc4ff"/>
  <path d="M0 690 Q360 590 700 735 T1600 680 V900 H0Z" fill="#ffd934"/>
  <circle cx="1425" cy="145" r="112" fill="#ff7096" stroke="#111" stroke-width="12"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#111">
    <text x="90" y="115" font-size="34" font-weight="900" letter-spacing="4">FÍSICA • MAPAS DO ENEM</text>
    <text x="90" y="235" font-size="98" font-weight="900">LEIS DE NEWTON</text>
    <text x="90" y="315" font-size="52" font-weight="800">ENTENDA AS FORÇAS, NÃO DECORE FRASES</text>
  </g>
  <g stroke="#111" stroke-width="9" fill="#fff">
    <rect x="90" y="380" width="410" height="190" rx="28"/>
    <rect x="595" y="380" width="410" height="190" rx="28" fill="#6dd285"/>
    <rect x="1100" y="380" width="410" height="190" rx="28" fill="#2e8fea"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#111" font-weight="900">
    <text x="130" y="445" font-size="34">1ª LEI</text><text x="130" y="505" font-size="46">INÉRCIA</text><text x="130" y="550" font-size="26">ΣF = 0 → a = 0</text>
    <text x="635" y="445" font-size="34">2ª LEI</text><text x="635" y="505" font-size="46">ΣF = m·a</text><text x="635" y="550" font-size="26">RESULTANTE MUDA v</text>
    <text x="1140" y="445" font-size="34">3ª LEI</text><text x="1140" y="505" font-size="41">AÇÃO ↔ REAÇÃO</text><text x="1140" y="550" font-size="26">CORPOS DIFERENTES</text>
  </g>
  <g stroke="#111" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <rect x="675" y="665" width="250" height="135" rx="18" fill="#fff"/>
    <path d="M800 665V600"/><path d="M780 625l20-25 20 25" fill="none"/>
    <path d="M800 800v65"/><path d="M780 840l20 25 20-25" fill="none"/>
    <path d="M675 730h-105"/><path d="M600 710l-30 20 30 20" fill="none"/>
    <path d="M925 730h145"/><path d="M1040 710l30 20-30 20" fill="none"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#111" font-size="26" font-weight="900">
    <text x="830" y="625">N</text><text x="830" y="860">P</text><text x="535" y="695">ATRITO</text><text x="960" y="695">FORÇA</text>
    <text x="1080" y="790" font-size="30">DESENHE → SOME → RESOLVA</text>
  </g>
</svg>
