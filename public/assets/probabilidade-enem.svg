<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Probabilidade no ENEM</title>
  <desc id="desc">Mapa visual com espaço amostral, eventos, complemento e árvore de possibilidades.</desc>
  <rect width="1600" height="900" fill="#fff8df"/>
  <path d="M0 0h1600v140H0z" fill="#19224d"/>
  <circle cx="1460" cy="70" r="170" fill="#ffcc31" opacity=".95"/>
  <circle cx="90" cy="820" r="170" fill="#ff5c73" opacity=".95"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="85" y="90" font-size="40" font-weight="700" fill="#fff">MAPAS DO ENEM • MATEMÁTICA</text>
    <text x="90" y="260" font-size="92" font-weight="900" fill="#19224d">PROBABILIDADE</text>
    <text x="94" y="325" font-size="34" font-weight="700" fill="#4b5279">organize os casos antes da conta</text>
    <g transform="translate(90 390)">
      <rect width="400" height="275" rx="30" fill="#5ad4c6" stroke="#19224d" stroke-width="7"/>
