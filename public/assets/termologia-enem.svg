<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Termologia no ENEM</title>
  <desc id="desc">Mapa visual conectando temperatura, calor, equilíbrio e transformação.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1e3a8a"/><stop offset="1" stop-color="#dc2626"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".25"/></filter></defs>
  <rect width="1600" height="900" rx="46" fill="url(#bg)"/>
  <circle cx="1390" cy="130" r="230" fill="#fbbf24" opacity=".2"/><circle cx="150" cy="820" r="270" fill="#7dd3fc" opacity=".15"/>
  <text x="100" y="120" fill="#fde68a" font-family="Arial,sans-serif" font-size="36" font-weight="700">FÍSICA • MAPA DE REVISÃO</text>
  <text x="100" y="235" fill="white" font-family="Arial,sans-serif" font-size="88" font-weight="900">TERMOLOGIA</text>
  <text x="100" y="310" fill="#dbeafe" font-family="Arial,sans-serif" font-size="42">calor • temperatura • energia</text>
  <g filter="url(#sh)" font-family="Arial,sans-serif"><rect x="80" y="430" width="320" height="150" rx="30" fill="white"/><text x="115" y="520" fill="#1d4ed8" font-size="32" font-weight="900">TEMPERATURA</text><rect x="465" y="430" width="300" height="150" rx="30" fill="white"/><text x="555" y="520" fill="#dc2626" font-size="36" font-weight="900">CALOR</text><rect x="830" y="430" width="300" height="150" rx="30" fill="white"/><text x="850" y="520" fill="#0369a1" font-size="31" font-weight="900">EQUILÍBRIO</text><rect x="1195" y="430" width="325" height="150" rx="30" fill="white"/><text x="1218" y="520" fill="#b91c1c" font-size="29" font-weight="900">TRANSFORMAÇÃO</text></g>
  <path d="M410 505 H450 M775 505 H815 M1140 505 H1180" stroke="#facc15" stroke-width="13" stroke-linecap="round"/><path d="M440 485 L460 505 L440 525 M805 485 L825 505 L805 525 M1170 485 L1190 505 L1170 525" fill="none" stroke="#facc15" stroke-width="9"/>
  <g filter="url(#sh)"><rect x="255" y="680" width="1090" height="112" rx="32" fill="#eff6ff"/><text x="345" y="753" fill="#1e3a8a" font-family="Arial,sans-serif" font-size="39" font-weight="900">MECANISMO → GRANDEZA → EFEITO</text></g>
  <text x="100" y="850" fill="white" font-family="Arial,sans-serif" font-size="29" font-weight="700">Mapas do ENEM • entenda a troca de energia</text>
</svg>
