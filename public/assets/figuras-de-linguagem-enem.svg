<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Figuras de linguagem no ENEM</title>
  <desc id="desc">Mapa visual ligando recurso expressivo, contexto e efeito de sentido</desc>
  <rect width="1600" height="900" fill="#fff8e6"/>
  <circle cx="1450" cy="100" r="230" fill="#ff5f57" opacity=".14"/>
  <circle cx="120" cy="800" r="240" fill="#31c4a4" opacity=".15"/>
  <text x="100" y="115" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f766e">MAPAS DO ENEM • LINGUAGENS</text>
  <text x="100" y="230" font-family="Arial,sans-serif" font-size="78" font-weight="900" fill="#20243a">FIGURAS DE</text>
  <text x="100" y="320" font-family="Arial,sans-serif" font-size="78" font-weight="900" fill="#ff5f57">LINGUAGEM</text>
  <rect x="100" y="410" width="400" height="250" rx="38" fill="#ffd166" stroke="#20243a" stroke-width="7"/>
  <text x="300" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="900" fill="#20243a">RECURSO</text>
  <text x="300" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#20243a">metáfora • ironia</text>
  <path d="M530 535 L650 535" stroke="#20243a" stroke-width="12" stroke-linecap="round"/>
  <path d="M630 510 L660 535 L630 560" fill="none" stroke="#20243a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="690" y="410" width="320" height="250" rx="38" fill="#6c63ff" stroke="#20243a" stroke-width="7"/>
  <text x="850" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="900" fill="#fff">CONTEXTO</text>
  <text x="850" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">gênero • intenção</text>
  <path d="M1040 535 L1160 535" stroke="#20243a" stroke-width="12" stroke-linecap="round"/>
  <path d="M1140 510 L1170 535 L1140 560" fill="none" stroke="#20243a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1200" y="410" width="300" height="250" rx="38" fill="#31c4a4" stroke="#20243a" stroke-width="7"/>
  <text x="1350" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="900" fill="#20243a">EFEITO</text>
  <text x="1350" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#20243a">crítica • ênfase</text>
  <text x="800" y="790" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#20243a">Não decore apenas o nome: explique o sentido.</text>
</svg>
