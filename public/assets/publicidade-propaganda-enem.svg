<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Publicidade e propaganda no ENEM</title><desc id="desc">Mapa visual para interpretar anúncios por objetivo, público, recursos e efeitos.</desc>
<rect width="1600" height="900" fill="#fff4ec"/><rect width="1600" height="150" fill="#4d2a7e"/><circle cx="1460" cy="120" r="210" fill="#ffce3a"/><circle cx="105" cy="820" r="175" fill="#ee5d7b"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#321956"><text x="90" y="98" font-size="38" font-weight="700" fill="#fff">MAPAS DO ENEM • LINGUAGENS</text>
<text x="90" y="252" font-size="64" font-weight="900">PUBLICIDADE E PROPAGANDA</text><text x="90" y="320" font-size="36" font-weight="700">COMO A MENSAGEM TENTA CONVENCER?</text>
<g transform="translate(90 390)"><rect width="330" height="245" rx="32" fill="#ffd34f"/><text x="165" y="68" text-anchor="middle" font-size="34" font-weight="900">OBJETIVO</text><text x="165" y="125" text-anchor="middle" font-size="25">Comprar, aderir</text><text x="165" y="165" text-anchor="middle" font-size="25">ou mudar atitude?</text><path d="M274 190l35 21-35 21z" fill="#4d2a7e"/></g>
<g transform="translate(455 390)"><rect width="330" height="245" rx="32" fill="#73d9e6"/><text x="165" y="68" text-anchor="middle" font-size="34" font-weight="900">PÚBLICO</text><text x="165" y="125" text-anchor="middle" font-size="25">Para quem</text><text x="165" y="165" text-anchor="middle" font-size="25">a peça foi feita?</text><path d="M274 190l35 21-35 21z" fill="#4d2a7e"/></g>
<g transform="translate(820 390)"><rect width="330" height="245" rx="32" fill="#a9e879"/><text x="165" y="68" text-anchor="middle" font-size="34" font-weight="900">RECURSOS</text><text x="165" y="125" text-anchor="middle" font-size="25">Palavras, imagens</text><text x="165" y="165" text-anchor="middle" font-size="25">cores e sons</text><path d="M274 190l35 21-35 21z" fill="#4d2a7e"/></g>
<g transform="translate(1185 390)"><rect width="330" height="245" rx="32" fill="#ff9770"/><text x="165" y="68" text-anchor="middle" font-size="32" font-weight="900">EFEITO</text><text x="165" y="125" text-anchor="middle" font-size="25">Sensações, valores</text><text x="165" y="165" text-anchor="middle" font-size="25">e representações</text><path d="M274 190l35 21-35 21z" fill="#4d2a7e"/></g>
<rect x="390" y="710" width="820" height="112" rx="56" fill="#4d2a7e"/><text x="800" y="780" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">OPRE: OBJETIVO → PÚBLICO → RECURSOS → EFEITO</text></g></svg>