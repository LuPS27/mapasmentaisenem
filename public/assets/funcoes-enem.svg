  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#312e81"/><stop offset="1" stop-color="#0891b2"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".25"/></filter></defs>
  <rect width="1600" height="900" rx="46" fill="url(#bg)"/>
  <circle cx="1390" cy="120" r="230" fill="#facc15" opacity=".17"/><circle cx="140" cy="840" r="270" fill="#a7f3d0" opacity=".12"/>
