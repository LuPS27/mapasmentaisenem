<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Eletroquímica no ENEM</title>
  <desc id="desc">Mapa visual com oxidação no ânodo, fluxo de elétrons e redução no cátodo</desc>
  <rect width="1600" height="900" fill="#fff7e8"/>
  <circle cx="1465" cy="75" r="230" fill="#ffcb47"/>
  <circle cx="70" cy="840" r="245" fill="#64d8cb"/>
  <path d="M0 210 C310 100 570 310 860 185 S1320 100 1600 235" fill="none" stroke="#241845" stroke-width="18" opacity=".12"/>
  <text x="110" y="130" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#6a35c7">MAPAS DO ENEM • QUÍMICA</text>
  <text x="110" y="235" font-family="Arial, sans-serif" font-size="88" font-weight="900" fill="#241845">ELETROQUÍMICA</text>
  <text x="110" y="305" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#241845">siga o caminho dos elétrons</text>
  <g font-family="Arial, sans-serif" fill="#241845">
    <rect x="110" y="410" width="400" height="225" rx="38" fill="#ff6b6b"/>
    <text x="310" y="480" text-anchor="middle" font-size="39" font-weight="900">OXIDAÇÃO</text>
    <text x="310" y="540" text-anchor="middle" font-size="30" font-weight="700">perde e⁻</text>
    <text x="310" y="590" text-anchor="middle" font-size="30" font-weight="700">ÂNODO</text>
    <rect x="1090" y="410" width="400" height="225" rx="38" fill="#64d8cb"/>
    <text x="1290" y="480" text-anchor="middle" font-size="39" font-weight="900">REDUÇÃO</text>
    <text x="1290" y="540" text-anchor="middle" font-size="30" font-weight="700">ganha e⁻</text>
    <text x="1290" y="590" text-anchor="middle" font-size="30" font-weight="700">CÁTODO</text>
    <rect x="575" y="455" width="450" height="140" rx="70" fill="#9c7cff"/>
    <text x="800" y="515" text-anchor="middle" font-size="36" font-weight="900">ELÉTRONS</text>
    <text x="800" y="560" text-anchor="middle" font-size="26" font-weight="700">ânodo → cátodo</text>
  </g>
  <path d="M520 525 H555" stroke="#241845" stroke-width="12" stroke-linecap="round"/>
  <path d="M1045 525 H1080" stroke="#241845" stroke-width="12" stroke-linecap="round"/>
  <path d="M535 503 L560 525 L535 547 M1060 503 L1085 525 L1060 547" fill="none" stroke="#241845" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="310" y="720" width="430" height="90" rx="30" fill="#ffcb47"/>
  <text x="525" y="777" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="900" fill="#241845">PILHA: produz energia</text>
  <rect x="860" y="720" width="430" height="90" rx="30" fill="#9c7cff"/>
  <text x="1075" y="777" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="900" fill="#241845">ELETRÓLISE: recebe energia</text>
</svg>
