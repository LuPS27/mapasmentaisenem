<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Questão agrária no ENEM</title><desc id="desc">Mapa visual com estrutura fundiária, produção, trabalho, conflitos e ambiente no campo brasileiro.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#153b2b"/><stop offset="1" stop-color="#368756"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".25"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1460" cy="100" r="245" fill="#f4c649"/><circle cx="90" cy="820" r="260" fill="#d9693b" opacity=".9"/>
<text x="100" y="125" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#a9f0c2">CIÊNCIAS HUMANAS • GEOGRAFIA</text>
<text x="100" y="245" font-family="Arial,sans-serif" font-size="82" font-weight="900" fill="#fff">QUESTÃO AGRÁRIA</text><text x="100" y="330" font-family="Arial,sans-serif" font-size="58" font-weight="800" fill="#f4c649">NO ENEM</text>
<g filter="url(#s)" font-family="Arial,sans-serif">
<rect x="100" y="400" width="320" height="270" rx="30" fill="#fff"/><text x="260" y="470" text-anchor="middle" font-size="29" font-weight="900" fill="#245e3d">TERRA</text><text x="260" y="525" text-anchor="middle" font-size="23" fill="#273d32">Estrutura fundiária</text><text x="260" y="570" text-anchor="middle" font-size="23" fill="#273d32">Acesso e propriedade</text>
<rect x="460" y="400" width="320" height="270" rx="30" fill="#fff"/><text x="620" y="470" text-anchor="middle" font-size="29" font-weight="900" fill="#d05a34">PRODUÇÃO</text><text x="620" y="525" text-anchor="middle" font-size="23" fill="#273d32">Técnica e mercados</text><text x="620" y="570" text-anchor="middle" font-size="23" fill="#273d32">Agronegócio e família</text>
<rect x="820" y="400" width="320" height="270" rx="30" fill="#fff"/><text x="980" y="470" text-anchor="middle" font-size="29" font-weight="900" fill="#4266b2">TRABALHO</text><text x="980" y="525" text-anchor="middle" font-size="23" fill="#273d32">Mecanização</text><text x="980" y="570" text-anchor="middle" font-size="23" fill="#273d32">Relações sociais</text>
<rect x="1180" y="400" width="320" height="270" rx="30" fill="#fff"/><text x="1340" y="470" text-anchor="middle" font-size="29" font-weight="900" fill="#7650a6">TERRITÓRIO</text><text x="1340" y="525" text-anchor="middle" font-size="23" fill="#273d32">Conflitos e políticas</text><text x="1340" y="570" text-anchor="middle" font-size="23" fill="#273d32">Ambiente e poder</text>
</g>
<rect x="260" y="750" width="1080" height="88" rx="38" fill="#f4c649"/><text x="800" y="808" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="900" fill="#153b2b">ESCALA → VARIÁVEL → AGENTES → CAUSA</text></svg>