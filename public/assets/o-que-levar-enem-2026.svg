    <rect x="120" y="550" width="600" height="95" rx="22" fill="#ffd934" stroke="#111" stroke-width="7"/><text x="170" y="611">✓ Caneta preta transparente</text>
    <rect x="120" y="670" width="600" height="95" rx="22" fill="#6dd285" stroke="#111" stroke-width="7"/><text x="170" y="731">✓ Água + lanche</text>
  </g>
  <g transform="translate(850 415)">
    <rect width="570" height="350" rx="34" fill="#111"/><text x="285" y="85" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-weight="900" font-size="39">HORÁRIO DE BRASÍLIA</text>
    <text x="55" y="165" fill="#ffd934" font-family="Arial,sans-serif" font-weight="900" font-size="52">12h</text><text x="235" y="165" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="35">portões abrem</text>
    <text x="55" y="235" fill="#ff7096" font-family="Arial,sans-serif" font-weight="900" font-size="52">13h</text><text x="235" y="235" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="35">portões fecham</text>
    <text x="55" y="305" fill="#6dd285" font-family="Arial,sans-serif" font-weight="900" font-size="52">13h30</text><text x="275" y="305" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="35">prova começa</text>
