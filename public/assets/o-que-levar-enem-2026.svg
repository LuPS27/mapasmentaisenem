<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">O que levar para o ENEM 2026</title><desc id="desc">Checklist visual com documento, caneta preta transparente, água e horários dos portões</desc>
  <rect width="1600" height="900" fill="#ffd934"/><path d="M0 690L1600 510V900H0Z" fill="#2e8fea"/>
  <circle cx="1390" cy="140" r="190" fill="#ff7096" stroke="#111" stroke-width="12"/><circle cx="180" cy="740" r="130" fill="#6dd285" stroke="#111" stroke-width="12"/>
  <rect x="90" y="80" width="1420" height="740" rx="42" fill="#fff" stroke="#111" stroke-width="14"/>
  <rect x="120" y="110" width="400" height="62" rx="31" fill="#6dd285" stroke="#111" stroke-width="7"/><text x="320" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="31">CHECKLIST ENEM 2026</text>
  <text x="120" y="285" font-family="Arial,sans-serif" font-weight="900" font-size="82">O QUE LEVAR</text><text x="120" y="370" font-family="Arial,sans-serif" font-weight="900" font-size="82">PARA A PROVA?</text>
