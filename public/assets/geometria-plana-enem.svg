<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Geometria plana no ENEM</title>
  <desc id="desc">Mapa visual com perímetro, área, escala e semelhança</desc>
  <rect width="1600" height="900" fill="#fff7e8"/>
  <circle cx="1480" cy="60" r="240" fill="#ffcb47"/>
  <circle cx="70" cy="845" r="245" fill="#64d8cb"/>
  <path d="M0 210 C330 100 570 310 870 185 S1320 95 1600 235" fill="none" stroke="#241845" stroke-width="18" opacity=".12"/>
  <text x="110" y="130" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#6a35c7">MAPAS DO ENEM • MATEMÁTICA</text>
  <text x="110" y="235" font-family="Arial, sans-serif" font-size="88" font-weight="900" fill="#241845">GEOMETRIA PLANA</text>
  <text x="110" y="305" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#241845">desenhe antes de calcular</text>
  <g font-family="Arial, sans-serif" fill="#241845">
    <rect x="110" y="395" width="610" height="170" rx="35" fill="#ff6b6b"/>
    <text x="155" y="460" font-size="38" font-weight="900">PERÍMETRO</text>
    <text x="155" y="515" font-size="29" font-weight="700">contorno • unidade linear</text>
    <rect x="880" y="395" width="610" height="170" rx="35" fill="#64d8cb"/>
    <text x="925" y="460" font-size="38" font-weight="900">ÁREA</text>
    <text x="925" y="515" font-size="29" font-weight="700">superfície • unidade²</text>
    <rect x="110" y="630" width="610" height="170" rx="35" fill="#ffcb47"/>
    <text x="155" y="695" font-size="38" font-weight="900">ESCALA</text>
    <text x="155" y="750" font-size="29" font-weight="700">comprimento k • área k²</text>
    <rect x="880" y="630" width="610" height="170" rx="35" fill="#9c7cff"/>
    <text x="925" y="695" font-size="38" font-weight="900">SEMELHANÇA</text>
    <text x="925" y="750" font-size="29" font-weight="700">ângulos iguais • lados proporcionais</text>
  </g>
  <path d="M760 430 L820 500 L760 550 Z" fill="none" stroke="#241845" stroke-width="12"/>
  <circle cx="820" cy="715" r="60" fill="none" stroke="#241845" stroke-width="12"/>
</svg>
