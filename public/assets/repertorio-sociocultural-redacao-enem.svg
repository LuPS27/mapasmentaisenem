<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Repertório sociocultural na redação do ENEM</title>
  <desc id="desc">Mapa visual conectando repertório, análise, argumento e tema na redação do ENEM.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#4c1d95"/><stop offset="1" stop-color="#be123c"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".22"/></filter></defs>
  <rect width="1600" height="900" rx="46" fill="url(#bg)"/>
  <circle cx="1370" cy="140" r="220" fill="#fbbf24" opacity=".16"/><circle cx="160" cy="820" r="260" fill="#fb7185" opacity=".14"/>
  <text x="100" y="120" fill="#fde68a" font-family="Arial,sans-serif" font-size="36" font-weight="700">REDAÇÃO • COMPETÊNCIA II</text>
  <text x="100" y="225" fill="white" font-family="Arial,sans-serif" font-size="76" font-weight="900">REPERTÓRIO</text>
  <text x="100" y="300" fill="#ffe4e6" font-family="Arial,sans-serif" font-size="52" font-weight="800">SOCIOCULTURAL</text>
  <g filter="url(#sh)" font-family="Arial,sans-serif"><rect x="100" y="420" width="300" height="150" rx="30" fill="white"/><text x="150" y="490" fill="#6d28d9" font-size="30" font-weight="800">1. REFERÊNCIA</text><text x="150" y="535" fill="#4c1d95" font-size="25">o conhecimento</text><rect x="650" y="420" width="300" height="150" rx="30" fill="white"/><text x="710" y="490" fill="#be123c" font-size="30" font-weight="800">2. ANÁLISE</text><text x="710" y="535" fill="#881337" font-size="25">o significado</text><rect x="1200" y="420" width="300" height="150" rx="30" fill="white"/><text x="1260" y="490" fill="#b45309" font-size="30" font-weight="800">3. ENLACE</text><text x="1260" y="535" fill="#78350f" font-size="25">o argumento</text></g>
  <path d="M410 495 H630 M960 495 H1180" stroke="#fde68a" stroke-width="14" stroke-linecap="round"/><path d="M600 470 L635 495 L600 520 M1150 470 L1185 495 L1150 520" fill="none" stroke="#fde68a" stroke-width="12"/>
  <g filter="url(#sh)"><rect x="420" y="660" width="760" height="120" rx="32" fill="#fff7ed"/><text x="520" y="735" fill="#7c2d12" font-family="Arial,sans-serif" font-size="40" font-weight="900">PERTINENTE + PRECISO + PRODUTIVO</text></g>
  <text x="100" y="850" fill="white" font-family="Arial,sans-serif" font-size="29" font-weight="700">Mapas do ENEM • a referência precisa trabalhar pelo argumento</text>
</svg>
