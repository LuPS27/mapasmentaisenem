<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Fotossíntese no ENEM</title><desc id="desc">Mapa visual com luz, água, gás carbônico, ATP, NADPH, carbono e oxigênio.</desc>
<rect width="1600" height="900" fill="#effbea"/><rect width="1600" height="150" fill="#155e48"/><circle cx="1460" cy="120" r="210" fill="#ffd23f"/><circle cx="100" cy="820" r="175" fill="#3b82f6"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#123d32"><text x="90" y="98" font-size="38" font-weight="700" fill="#fff">MAPAS DO ENEM • BIOLOGIA</text>
<text x="90" y="260" font-size="76" font-weight="900">FOTOSSÍNTESE</text><text x="90" y="327" font-size="36" font-weight="700">SIGA A MATÉRIA E A ENERGIA</text>
<g transform="translate(90 390)"><rect width="330" height="245" rx="32" fill="#ffdc5d"/><text x="165" y="68" text-anchor="middle" font-size="32" font-weight="900">LUZ + H₂O</text><text x="165" y="125" text-anchor="middle" font-size="25">Tilacoides</text><text x="165" y="165" text-anchor="middle" font-size="25">elétrons e prótons</text><path d="M274 190l35 21-35 21z" fill="#155e48"/></g>
<g transform="translate(455 390)"><rect width="330" height="245" rx="32" fill="#78dce8"/><text x="165" y="68" text-anchor="middle" font-size="30" font-weight="900">ATP + NADPH</text><text x="165" y="125" text-anchor="middle" font-size="25">Energia para</text><text x="165" y="165" text-anchor="middle" font-size="25">fixar carbono</text><path d="M274 190l35 21-35 21z" fill="#155e48"/></g>
<g transform="translate(820 390)"><rect width="330" height="245" rx="32" fill="#a6e56f"/><text x="165" y="68" text-anchor="middle" font-size="32" font-weight="900">CO₂</text><text x="165" y="125" text-anchor="middle" font-size="25">Ciclo de Calvin</text><text x="165" y="165" text-anchor="middle" font-size="25">no estroma</text><path d="M274 190l35 21-35 21z" fill="#155e48"/></g>
<g transform="translate(1185 390)"><rect width="330" height="245" rx="32" fill="#ff9670"/><text x="165" y="68" text-anchor="middle" font-size="31" font-weight="900">G3P + O₂</text><text x="165" y="125" text-anchor="middle" font-size="25">Matéria orgânica</text><text x="165" y="165" text-anchor="middle" font-size="25">e oxigênio</text><path d="M274 190l35 21-35 21z" fill="#155e48"/></g>
<rect x="360" y="710" width="880" height="112" rx="56" fill="#155e48"/><text x="800" y="780" text-anchor="middle" font-size="37" font-weight="800" fill="#fff">MEG: MATÉRIA → ENERGIA → GRÁFICO</text></g></svg>