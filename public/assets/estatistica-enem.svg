<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Estatística no ENEM</title>
  <desc id="desc">Mapa visual com média, mediana, moda, amplitude, tabelas e gráficos</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b195f"/><stop offset="1" stop-color="#4a27a8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1450" cy="120" r="210" fill="#ffcf48" opacity=".14"/><circle cx="120" cy="820" r="260" fill="#4fe0bd" opacity=".12"/>
  <text x="90" y="115" fill="#ffcf48" font-family="Arial, sans-serif" font-size="34" font-weight="700">MAPAS DO ENEM • MATEMÁTICA</text>
  <text x="90" y="220" fill="#fff" font-family="Arial, sans-serif" font-size="82" font-weight="900">ESTATÍSTICA</text>
  <text x="90" y="288" fill="#ddd4ff" font-family="Arial, sans-serif" font-size="38">escolha a medida certa para cada pergunta</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="90" y="360" width="330" height="180" rx="28" fill="#fff"/>
    <text x="125" y="415" fill="#2b195f" font-size="29" font-weight="800">MÉDIA</text>
    <text x="125" y="462" fill="#574d70" font-size="25">soma ÷ quantidade</text>
    <text x="125" y="505" fill="#ee596f" font-size="24" font-weight="700">sensível a extremos</text>
    <rect x="465" y="360" width="330" height="180" rx="28" fill="#fff"/>
    <text x="500" y="415" fill="#2b195f" font-size="29" font-weight="800">MEDIANA</text>
    <text x="500" y="462" fill="#574d70" font-size="25">centro após ordenar</text>
    <text x="500" y="505" fill="#4a27a8" font-size="24" font-weight="700">resiste a extremos</text>
    <rect x="840" y="360" width="330" height="180" rx="28" fill="#fff"/>
    <text x="875" y="415" fill="#2b195f" font-size="29" font-weight="800">MODA</text>
    <text x="875" y="462" fill="#574d70" font-size="25">valor mais frequente</text>
    <text x="875" y="505" fill="#009d85" font-size="24" font-weight="700">pode haver empate</text>
    <rect x="1215" y="360" width="295" height="180" rx="28" fill="#ffcf48"/>
    <text x="1250" y="415" fill="#2b195f" font-size="29" font-weight="800">AMPLITUDE</text>
    <text x="1250" y="462" fill="#2b195f" font-size="24">maior − menor</text>
    <text x="1250" y="505" fill="#2b195f" font-size="23" font-weight="700">mede dispersão</text>
  </g>
  <g transform="translate(90 625)">
    <rect width="700" height="185" rx="30" fill="#201344" stroke="#7a62c8" stroke-width="3"/>
    <text x="38" y="53" fill="#ffcf48" font-family="Arial, sans-serif" font-size="30" font-weight="800">LEIA ANTES DE CALCULAR</text>
    <text x="38" y="100" fill="#fff" font-family="Arial, sans-serif" font-size="25">título • fonte • unidade • legenda</text>
    <text x="38" y="142" fill="#fff" font-family="Arial, sans-serif" font-size="25">escala • período • total da amostra</text>
  </g>
  <g transform="translate(870 610)">
    <line x1="0" y1="200" x2="620" y2="200" stroke="#fff" stroke-width="7"/><line x1="0" y1="200" x2="0" y2="15" stroke="#fff" stroke-width="7"/>
    <rect x="60" y="115" width="75" height="85" rx="10" fill="#4fe0bd"/><rect x="180" y="72" width="75" height="128" rx="10" fill="#ffcf48"/><rect x="300" y="35" width="75" height="165" rx="10" fill="#ff7f8f"/><rect x="420" y="90" width="75" height="110" rx="10" fill="#9c82ff"/>
    <polyline points="95,90 217,45 337,70 457,20 575,55" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fff"><circle cx="95" cy="90" r="10"/><circle cx="217" cy="45" r="10"/><circle cx="337" cy="70" r="10"/><circle cx="457" cy="20" r="10"/><circle cx="575" cy="55" r="10"/></g>
  </g>
</svg>
