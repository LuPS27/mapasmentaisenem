  <rect width="1600" height="900" rx="46" fill="url(#bg)"/>
  <circle cx="1380" cy="145" r="220" fill="#a3e635" opacity=".18"/><circle cx="150" cy="820" r="260" fill="#38bdf8" opacity=".14"/>
