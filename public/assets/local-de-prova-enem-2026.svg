<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Local de prova do ENEM 2026</title><desc id="desc">Guia visual para consultar o Cartão de Confirmação e planejar o trajeto até o local da prova.</desc>
  <rect width="1600" height="900" rx="48" fill="#f6f0e4"/>
  <circle cx="1450" cy="135" r="190" fill="#ffd934"/>
  <circle cx="125" cy="805" r="205" fill="#6dd285"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#111">
    <text x="88" y="105" font-size="34" font-weight="900" letter-spacing="4">ENEM 2026 • GUIA OFICIAL</text>
    <text x="88" y="230" font-size="98" font-weight="900">LOCAL DE PROVA</text>
    <text x="92" y="305" font-size="44" font-weight="800">CONSULTE • CONFIRA • PLANEJE O TRAJETO</text>
  </g>
  <g stroke="#111" stroke-width="9" fill="#fff">
    <rect x="90" y="380" width="430" height="205" rx="28" fill="#2e8fea"/>
    <rect x="585" y="380" width="430" height="205" rx="28" fill="#cfc4ff"/>
    <rect x="1080" y="380" width="430" height="205" rx="28" fill="#ff7096"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#111" text-anchor="middle">
    <text x="305" y="448" font-size="32" font-weight="900">1. ENTRE</text><text x="305" y="505" font-size="43" font-weight="900">PÁGINA DO</text><text x="305" y="550" font-size="43" font-weight="900">PARTICIPANTE</text>
    <text x="800" y="448" font-size="32" font-weight="900">2. ABRA</text><text x="800" y="512" font-size="41" font-weight="900">CARTÃO DE</text><text x="800" y="557" font-size="41" font-weight="900">CONFIRMAÇÃO</text>
    <text x="1295" y="448" font-size="32" font-weight="900">3. CONFIRA</text><text x="1295" y="512" font-size="41" font-weight="900">ENDEREÇO</text><text x="1295" y="557" font-size="41" font-weight="900">E HORÁRIOS</text>
  </g>
  <g stroke="#111" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M245 705h1070"/>
    <path d="M1245 655l70 50-70 50"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#111" font-weight="900">
