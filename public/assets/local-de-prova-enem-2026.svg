    <text x="335" y="748" font-size="31">PORTÕES: 12H ÀS 13H • HORÁRIO DE BRASÍLIA</text>
    <text x="335" y="805" font-size="27">CHEGUE CEDO. CARTÃO NÃO SUBSTITUI DOCUMENTO COM FOTO.</text>
  </g>
