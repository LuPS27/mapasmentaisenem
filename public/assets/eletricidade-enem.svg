<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Eletricidade no ENEM</title>
  <desc id="desc">Mapa visual conectando tensão, corrente, resistência, potência e consumo de energia</desc>
  <rect width="1600" height="900" fill="#fff8e6"/>
  <circle cx="1450" cy="90" r="235" fill="#ffd166" opacity=".28"/>
  <circle cx="100" cy="820" r="250" fill="#6c63ff" opacity=".13"/>
  <text x="100" y="115" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f766e">MAPAS DO ENEM • FÍSICA</text>
  <text x="100" y="245" font-family="Arial,sans-serif" font-size="82" font-weight="900" fill="#20243a">ELETRICIDADE</text>
  <text x="100" y="335" font-family="Arial,sans-serif" font-size="58" font-weight="900" fill="#ff5f57">CIRCUITOS • POTÊNCIA • CONSUMO</text>
  <circle cx="310" cy="555" r="145" fill="#31c4a4" stroke="#20243a" stroke-width="7"/>
