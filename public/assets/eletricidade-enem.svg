  <text x="310" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#20243a">LEI DE OHM</text>
  <path d="M470 555 L650 555" stroke="#20243a" stroke-width="12" stroke-linecap="round"/>
  <path d="M625 530 L655 555 L625 580" fill="none" stroke="#20243a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="690" y="420" width="350" height="270" rx="42" fill="#ffd166" stroke="#20243a" stroke-width="7"/>
  <text x="865" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="900" fill="#20243a">P = U · I</text>
  <text x="865" y="600" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#20243a">POTÊNCIA</text>
  <path d="M1070 555 L1200 555" stroke="#20243a" stroke-width="12" stroke-linecap="round"/>
  <path d="M1175 530 L1205 555 L1175 580" fill="none" stroke="#20243a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
