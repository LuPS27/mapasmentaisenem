<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Óptica no ENEM</title><desc id="desc">Mapa visual com propagação, reflexão, refração, espelhos, lentes e visão.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a3d"/><stop offset="1" stop-color="#153f77"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".24"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="100" r="180" fill="#ffcc3d" opacity=".18"/><circle cx="120" cy="800" r="230" fill="#58e6d9" opacity=".12"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="100" y="105" fill="#58e6d9" font-size="34" font-weight="700">FÍSICA • REVISÃO VISUAL</text><text x="100" y="205" fill="#fff" font-size="86" font-weight="900">ÓPTICA NO ENEM</text><text x="100" y="260" fill="#dcecff" font-size="34">Siga o caminho da luz: fonte → meio → observador</text>
<g filter="url(#s)">
<rect x="100" y="345" width="400" height="180" rx="28" fill="#fff"/><text x="140" y="405" fill="#0a2450" font-size="34" font-weight="800">REFLEXÃO</text><text x="140" y="455" fill="#263b5d" font-size="27">i = r • ângulos com a normal</text><text x="140" y="495" fill="#263b5d" font-size="27">espelhos formam imagens</text>
<rect x="600" y="345" width="400" height="180" rx="28" fill="#ffcc3d"/><text x="640" y="405" fill="#0a2450" font-size="34" font-weight="800">REFRAÇÃO</text><text x="640" y="455" fill="#263b5d" font-size="27">n = c/v • Snell</text><text x="640" y="495" fill="#263b5d" font-size="27">velocidade e direção mudam</text>
<rect x="1100" y="345" width="400" height="180" rx="28" fill="#58e6d9"/><text x="1140" y="405" fill="#0a2450" font-size="34" font-weight="800">LENTES</text><text x="1140" y="455" fill="#263b5d" font-size="27">convergente × divergente</text><text x="1140" y="495" fill="#263b5d" font-size="27">foco, imagem e visão</text>
</g>
<path d="M500 435 H585" stroke="#fff" stroke-width="10"/><path d="M575 415 L600 435 575 455" fill="none" stroke="#fff" stroke-width="10"/><path d="M1000 435 H1085" stroke="#fff" stroke-width="10"/><path d="M1075 415 L1100 435 1075 455" fill="none" stroke="#fff" stroke-width="10"/>
<rect x="100" y="610" width="1400" height="150" rx="30" fill="#0b2b59" stroke="#fff" stroke-opacity=".25" stroke-width="3"/><text x="140" y="670" fill="#fff" font-size="33" font-weight="800">NA QUESTÃO:</text><text x="395" y="670" fill="#fff" font-size="31">desenhe a normal • preveja a imagem • só então calcule</text><text x="140" y="720" fill="#bfeee9" font-size="27">Espelho convexo amplia o campo visual | Miopia: lente divergente</text>
<text x="100" y="840" fill="#fff" font-size="29" font-weight="700">MAPAS MENTAIS ENEM</text></g></svg>