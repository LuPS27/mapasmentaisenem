<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Globalização no ENEM</title>
  <desc id="desc">Mapa visual conectando redes, fluxos, produção e desigualdades.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#0f766e"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".25"/></filter></defs>
  <rect width="1600" height="900" rx="46" fill="url(#bg)"/>
  <circle cx="1390" cy="130" r="230" fill="#fb7185" opacity=".18"/><circle cx="150" cy="820" r="270" fill="#2dd4bf" opacity=".13"/>
  <text x="100" y="120" fill="#fda4af" font-family="Arial,sans-serif" font-size="36" font-weight="700">GEOGRAFIA • MAPA DE REVISÃO</text>
  <text x="100" y="235" fill="white" font-family="Arial,sans-serif" font-size="88" font-weight="900">GLOBALIZAÇÃO</text>
  <text x="100" y="310" fill="#ccfbf1" font-family="Arial,sans-serif" font-size="42">redes • fluxos • desigualdades</text>
  <g filter="url(#sh)" font-family="Arial,sans-serif"><rect x="80" y="430" width="320" height="150" rx="30" fill="white"/><text x="160" y="520" fill="#1d4ed8" font-size="36" font-weight="900">REDES</text><rect x="465" y="430" width="300" height="150" rx="30" fill="white"/><text x="535" y="520" fill="#0f766e" font-size="36" font-weight="900">FLUXOS</text><rect x="830" y="430" width="300" height="150" rx="30" fill="white"/><text x="865" y="520" fill="#7c3aed" font-size="34" font-weight="900">PRODUÇÃO</text><rect x="1195" y="430" width="325" height="150" rx="30" fill="white"/><text x="1230" y="520" fill="#be123c" font-size="31" font-weight="900">DESIGUALDADE</text></g>
  <path d="M410 505 H450 M775 505 H815 M1140 505 H1180" stroke="#facc15" stroke-width="13" stroke-linecap="round"/><path d="M440 485 L460 505 L440 525 M805 485 L825 505 L805 525 M1170 485 L1190 505 L1170 525" fill="none" stroke="#facc15" stroke-width="9"/>
  <g filter="url(#sh)"><rect x="250" y="680" width="1100" height="112" rx="32" fill="#f0fdfa"/><text x="345" y="753" fill="#134e4a" font-family="Arial,sans-serif" font-size="38" font-weight="900">O QUE CIRCULA? QUEM CONTROLA?</text></g>
  <text x="100" y="850" fill="white" font-family="Arial,sans-serif" font-size="29" font-weight="700">Mapas do ENEM • conexão não significa igualdade</text>
</svg>
