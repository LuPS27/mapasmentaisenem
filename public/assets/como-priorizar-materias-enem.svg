<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Como priorizar matérias para o ENEM</title><desc id="desc">Mapa visual com grau da lacuna, conteúdo-alavanca e prazo disponível.</desc>
<rect width="1600" height="900" fill="#f3f7ff"/><rect width="1600" height="150" fill="#243d7a"/><circle cx="1460" cy="120" r="210" fill="#ffd447"/><circle cx="100" cy="820" r="175" fill="#39c69b"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1f315f"><text x="90" y="98" font-size="38" font-weight="700" fill="#fff">MAPAS DO ENEM • PLANEJAMENTO</text>
<text x="90" y="250" font-size="64" font-weight="900">O QUE ESTUDAR PRIMEIRO?</text><text x="90" y="318" font-size="36" font-weight="700">DECIDA COM EVIDÊNCIAS, NÃO COM PALPITES</text>
<g transform="translate(155 390)"><rect width="370" height="245" rx="32" fill="#ffcf4f"/><text x="185" y="68" text-anchor="middle" font-size="35" font-weight="900">GRAU</text><text x="185" y="125" text-anchor="middle" font-size="25">A lacuna se repete?</text><text x="185" y="165" text-anchor="middle" font-size="25">Há chute ou insegurança?</text><path d="M310 190l35 21-35 21z" fill="#243d7a"/></g>
<g transform="translate(615 390)"><rect width="370" height="245" rx="32" fill="#72dbe7"/><text x="185" y="68" text-anchor="middle" font-size="35" font-weight="900">ALAVANCA</text><text x="185" y="125" text-anchor="middle" font-size="25">Essa base desbloqueia</text><text x="185" y="165" text-anchor="middle" font-size="25">outros conteúdos?</text><path d="M310 190l35 21-35 21z" fill="#243d7a"/></g>
<g transform="translate(1075 390)"><rect width="370" height="245" rx="32" fill="#ff9274"/><text x="185" y="68" text-anchor="middle" font-size="35" font-weight="900">PRAZO</text><text x="185" y="125" text-anchor="middle" font-size="25">A ação é possível</text><text x="185" y="165" text-anchor="middle" font-size="25">no tempo disponível?</text><path d="M310 190l35 21-35 21z" fill="#243d7a"/></g>
<rect x="400" y="710" width="800" height="112" rx="56" fill="#243d7a"/><text x="800" y="780" text-anchor="middle" font-size="40" font-weight="800" fill="#fff">GAP: GRAU → ALAVANCA → PRAZO</text></g></svg>