<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Revolução Francesa no ENEM</title><desc id="desc">Mapa visual com Antigo Regime, crise, 1789, república, direitos e cidadania.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16213f"/><stop offset="1" stop-color="#4d1834"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".26"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="0" y="0" width="34" height="900" fill="#164f9b"/><rect x="34" y="0" width="34" height="900" fill="#fff"/><rect x="68" y="0" width="34" height="900" fill="#d63245"/><circle cx="1435" cy="110" r="210" fill="#f5c84c" opacity=".14"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="140" y="105" fill="#f5c84c" font-size="34" font-weight="700">HISTÓRIA • REVOLUÇÕES</text><text x="140" y="200" fill="#fff" font-size="77" font-weight="900">REVOLUÇÃO FRANCESA</text><text x="140" y="258" fill="#f4e6ee" font-size="34">Privilégios → crise → disputa → cidadania</text>
<g filter="url(#s)"><rect x="140" y="350" width="390" height="205" rx="30" fill="#fff"/><text x="180" y="413" fill="#242345" font-size="34" font-weight="900">ANTIGO REGIME</text><text x="180" y="465" fill="#4d4355" font-size="27">ordens e privilégios</text><text x="180" y="505" fill="#4d4355" font-size="27">crise fiscal + alimentos</text>
<rect x="605" y="350" width="390" height="205" rx="30" fill="#f5c84c"/><text x="645" y="413" fill="#242345" font-size="34" font-weight="900">1789</text><text x="645" y="465" fill="#4d4355" font-size="27">Assembleia + Bastilha</text><text x="645" y="505" fill="#4d4355" font-size="27">fim dos privilégios</text>
<rect x="1070" y="350" width="390" height="205" rx="30" fill="#fff"/><text x="1110" y="413" fill="#242345" font-size="34" font-weight="900">REPÚBLICA</text><text x="1110" y="465" fill="#4d4355" font-size="27">disputas e radicalização</text><text x="1110" y="505" fill="#4d4355" font-size="27">Diretório → Napoleão</text></g>
<g stroke="#fff" stroke-width="9" fill="none"><path d="M530 452 H590"/><path d="M580 434 L605 452 580 470"/><path d="M995 452 H1055"/><path d="M1045 434 L1070 452 1045 470"/></g>
<rect x="140" y="645" width="1320" height="130" rx="30" fill="#211d3b" stroke="#fff" stroke-opacity=".25" stroke-width="3"/><text x="180" y="703" fill="#fff" font-size="31" font-weight="800">QUESTÃO-CHAVE:</text><text x="500" y="703" fill="#fff" font-size="30">quem ganhou direitos e quem permaneceu excluído?</text><text x="180" y="750" fill="#ffdfe8" font-size="27">Liberdade • igualdade jurídica • propriedade • soberania nacional</text>
<text x="140" y="846" fill="#fff" font-size="29" font-weight="700">MAPAS MENTAIS ENEM</text></g></svg>